spring.application.name=backend
server.port=8091

#spring.datasource.url=jdbc:mysql://localhost:3306/kc_db
#spring.datasource.username=root
#spring.datasource.password=Anubhab@2004

spring.datasource.url=jdbc:postgresql://localhost:5432/karocharge
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

citrine.base-url=http://localhost:8080
citrine.websocket-url=ws://localhost:8081
citrine.hasura-url=http://localhost:8090/v1/graphql
citrine.hasura-admin-secret=CitrineOS!
citrine.tenant-id=1
citrine.default-evse-id=1
citrine.timeout-seconds=15
citrine.retry-attempts=2
citrine.retry-backoff-millis=300

logging.level.com.karocharge=INFO

# Comma-separated origins allowed for browser clients (operator UI, mobile web, etc.)
karocharge.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Operator dashboard: only show Citrine-linked chargers (hide legacy DB-only rows)
operator.include-unlinked-db-chargers=false
